<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="관상용 사이버 어항 — 픽셀 아트 물고기들이 헤엄치는 작은 수족관">
<title>픽셀어항 - Pixel Aquarium</title>
<link rel="icon" href='data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" shape-rendering="crispEdges"><rect width="16" height="16" rx="3" fill="%2304101e"/><rect x="5" y="6" width="6" height="4" fill="%2346d8ff"/><rect x="6" y="5" width="4" height="1" fill="%2346d8ff"/><rect x="6" y="10" width="4" height="1" fill="%2346d8ff"/><rect x="3" y="7" width="2" height="2" fill="%2317a8c8"/><rect x="2" y="6" width="1" height="1" fill="%2317a8c8"/><rect x="2" y="9" width="1" height="1" fill="%2317a8c8"/><rect x="9" y="7" width="1" height="1" fill="%23052235"/><rect x="12" y="3" width="1" height="1" fill="%23a8e6ff"/><rect x="13" y="5" width="1" height="1" fill="%23a8e6ff"/><rect x="12" y="12" width="1" height="1" fill="%23a8e6ff"/></svg>'>
</head>
<body>

<div class="app">
  <div class="frame" id="frame">
    <div class="tankwrap">
      <canvas id="tank" width="192" height="120" aria-label="픽셀 아트 사이버 어항. 물고기들이 헤엄치는 애니메이션. 클릭하면 먹이를 줄 수 있습니다."></canvas>
      <div class="scanlines"></div>
      <div class="vignette"></div>
      <div class="goldchip" id="goldChip"><span id="goldAmt">0</span></div>
      <div class="fishchip" id="fishChip" title="물고기+알 / 최대 수용량">🐟 <span id="fishCnt">0/30</span></div>
      <div class="toolbar" id="toolbar">
        <div class="feedbar" id="feedbar"></div>
        <div class="menubtns">
          <button data-sheet="shop">🏪 상점</button>
          <button data-sheet="dex">📖 도감</button>
          <button data-sheet="ach">🏆 업적</button>
          <button data-sheet="log">📜 기록</button>
        </div>
      </div>
      <div class="popup hidden" id="fishPopup"></div>
      <div class="dexcard hidden" id="dexCard"></div>
      <div class="toasts" id="toasts"></div>
    </div>
    <aside class="sheet" id="sheet">
      <div class="sheet-head"><span id="sheetTitle"></span><button id="sheetClose">✕ 닫기</button></div>
      <div id="shopBody" class="sheetbody"></div>
      <div id="dexBody" class="sheetbody hidden"></div>
      <div id="achBody" class="sheetbody hidden"></div>
      <div id="logBody" class="sheetbody hidden"></div>
    </aside>
  </div>
</div>

<script type="module" src="/src/main.ts"></script>
</body>
</html>
